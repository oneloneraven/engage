name: Sync Worker secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-worker-secrets
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-node-pnpm
      - name: Set OWNER_EMAIL on the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "$OWNER_EMAIL" ]; then
            echo "::error::OWNER_EMAIL is empty: set it as a secret of the production environment first"
            exit 1
          fi
          printf '%s' "$OWNER_EMAIL" | pnpm exec wrangler secret put OWNER_EMAIL --env production
      - name: Set TURNSTILE_SECRET_KEY on the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$TURNSTILE_SECRET_KEY" ]; then
            echo "::error::TURNSTILE_SECRET_KEY is empty: set it as a secret of the production environment first"
            exit 1
          fi
          printf '%s' "$TURNSTILE_SECRET_KEY" | pnpm exec wrangler secret put TURNSTILE_SECRET_KEY --env production
      - name: Set BETTER_STACK_TOKEN on the Worker, if it's set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_STACK_TOKEN: ${{ secrets.BETTER_STACK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$BETTER_STACK_TOKEN" ]; then
            echo "::notice::BETTER_STACK_TOKEN isn't set on the production environment yet, so it's left as it is"
            exit 0
          fi
          printf '%s' "$BETTER_STACK_TOKEN" | pnpm exec wrangler secret put BETTER_STACK_TOKEN --env production
      - name: Set CLOUDFLARE_ANALYTICS_TOKEN on the Worker, if it's set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_ANALYTICS_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_ANALYTICS_TOKEN isn't set on the production environment yet, so it's left as it is"
            exit 0
          fi
          printf '%s' "$CLOUDFLARE_ANALYTICS_TOKEN" | pnpm exec wrangler secret put CLOUDFLARE_ANALYTICS_TOKEN --env production
      - name: Set CL_USAGE_CLIENT_ID on the Worker, if it's set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CL_USAGE_CLIENT_ID: ${{ secrets.CL_USAGE_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CL_USAGE_CLIENT_ID" ]; then
            echo "::notice::CL_USAGE_CLIENT_ID isn't set on the production environment yet, so it's left as it is"
            exit 0
          fi
          printf '%s' "$CL_USAGE_CLIENT_ID" | pnpm exec wrangler secret put CL_USAGE_CLIENT_ID --env production
      - name: Set CL_USAGE_CLIENT_SECRET on the Worker, if it's set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CL_USAGE_CLIENT_SECRET: ${{ secrets.CL_USAGE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CL_USAGE_CLIENT_SECRET" ]; then
            echo "::notice::CL_USAGE_CLIENT_SECRET isn't set on the production environment yet, so it's left as it is"
            exit 0
          fi
          printf '%s' "$CL_USAGE_CLIENT_SECRET" | pnpm exec wrangler secret put CL_USAGE_CLIENT_SECRET --env production
